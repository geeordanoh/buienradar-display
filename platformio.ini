; PlatformIO project for the ESP32-2432S028R "Cheap Yellow Display" (CYD)
; 2.8" 240x320 ILI9341 SPI TFT + ESP32-WROOM.
;
; Secrets & location are compiled in at flash time from shell environment
; variables (see secrets.ini.example). Example flash command:
;
;   WIFI_SSID="MyNetwork" WIFI_PASS="hunter2" \
;   LATITUDE=52.0907 LONGITUDE=5.1214 LOCATION_NAME="Utrecht" \
;   pio run -t upload
;
; The build still compiles with these unset; it just falls back to safe
; defaults (empty WiFi + Amsterdam coords) so `pio run` never breaks.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    ; ---- TFT_eSPI configuration for the CYD (no library edits needed) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1          ; some CYD units need ILI9341_DRIVER or ST7789_DRIVER instead
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; ---- App configuration from the shell environment (see secrets.ini.example) ----
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DLATITUDE_STR="${sysenv.LATITUDE}"'
    '-DLONGITUDE_STR="${sysenv.LONGITUDE}"'
    '-DLOCATION_NAME="${sysenv.LOCATION_NAME}"'
